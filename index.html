<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pop Pals</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4fc3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* --- Core variables, responsive stage & reset (Phones, Foldables, Tablets & Desktop) --- */
:root{
  --ink:#1d4e6b;
  --k:#2b2d42;
  --sun:#ffd23f;
  --spring:cubic-bezier(.34,1.56,.64,1);
  /* Phones & Portrait Tablets fill 100% width; Landscape Tablets/Desktops scale up to 78vh */
  --sw:100vw;
  --u:clamp(1px, calc(var(--sw) / 390), 2.2px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-aspect-ratio: 4/5){
  :root{--sw:min(100vw, 76vh)}
  @supports (height:100dvh){:root{--sw:min(100vw, 76dvh)}}
}
@media (min-aspect-ratio: 11/10){
  :root{--sw:min(100vw, 66vh)}
  @supports (height:100dvh){:root{--sw:min(100vw, 66dvh)}}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{
  height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
  -webkit-touch-callout:none;
  background:radial-gradient(circle at 50% 25%,#163a5f,#071322 85%);
  font-family:'Fredoka','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  color:var(--ink);touch-action:manipulation;
}
#game{
  position:fixed;top:0;bottom:0;left:50%;width:var(--sw);
  margin-left:calc(var(--sw)/-2);overflow:hidden;
  box-shadow:0 0 64px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.12);
}
#scene,#field,#fx{position:absolute;inset:0;overflow:hidden}
#field{touch-action:none}
#scene,#fx{pointer-events:none}

/* --- Scenery & background animations --- */
.cl{
  position:absolute;left:0;
  width:calc(124 * var(--u));height:calc(40 * var(--u));
  background:var(--c,#fff);
  border-radius:calc(40 * var(--u));scale:var(--s,1);
  animation:drift linear infinite;opacity:.94;
  box-shadow:inset 0 calc(-5 * var(--u)) 0 rgba(180,215,245,.45),0 6px 10px rgba(0,0,0,.08);
}
.cl::before,.cl::after{content:"";position:absolute;border-radius:50%;background:var(--c,#fff)}
.cl::before{left:calc(18 * var(--u));top:calc(-22 * var(--u));width:calc(52 * var(--u));height:calc(52 * var(--u))}
.cl::after{left:calc(52 * var(--u));top:calc(-32 * var(--u));width:calc(64 * var(--u));height:calc(64 * var(--u))}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(calc(var(--sw) + 220px))}}

.sunb{
  position:absolute;width:calc(92 * var(--u));height:calc(92 * var(--u));border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe0,#ffd23f 65%,#ffae19 100%);
  box-shadow:0 0 0 calc(14 * var(--u)) rgba(255,230,120,.32),0 0 0 calc(32 * var(--u)) rgba(255,230,120,.16);
  animation:pulse 4s ease-in-out infinite;
}
.sunb::before{
  content:"";position:absolute;inset:calc(-68 * var(--u));border-radius:50%;
  background:repeating-conic-gradient(rgba(255,245,170,.38) 0 8deg,transparent 8deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);
  mask-image:radial-gradient(circle,#000 25%,transparent 68%);
  animation:spin 42s linear infinite;
}
@keyframes pulse{50%{scale:1.07}}
@keyframes spin{to{rotate:360deg}}

.st{
  position:absolute;border-radius:50%;background:#fff;
  box-shadow:0 0 6px 1px rgba(255,255,255,.8);
  animation:tw 3s ease-in-out infinite;
}
@keyframes tw{50%{opacity:.22;scale:.6}}

.bub{
  position:absolute;bottom:-40px;border-radius:50%;
  border:2px solid rgba(255,255,255,.8);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.65),rgba(255,255,255,.15) 60%);
  animation:up linear infinite;
}
@keyframes up{to{transform:translateY(-115vh)}}

.fish{position:absolute;left:0;animation:swim linear infinite;scale:clamp(1, calc(var(--sw)/440), 1.45)}
.fish svg{display:block}
@keyframes swim{from{transform:translateX(calc(var(--sw) + 80px))}to{transform:translateX(-140px)}}

.rays{
  position:absolute;inset:-20% -20% 30% -20%;
  background:repeating-linear-gradient(105deg,rgba(255,255,255,.2) 0 38px,transparent 38px 116px);
  -webkit-mask-image:linear-gradient(#000,transparent);
  mask-image:linear-gradient(#000,transparent);
  animation:sway 9s ease-in-out infinite alternate;
}
@keyframes sway{to{transform:translateX(56px)}}

.dots{
  position:absolute;inset:0;
  background:radial-gradient(circle,rgba(255,255,255,.6) 4px,transparent 5px) 0 0/46px 46px;
}
.planet{
  position:absolute;left:10%;top:20%;
  width:calc(88 * var(--u));height:calc(88 * var(--u));border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffc078,#e8590c 68%,#862e9c 100%);
  box-shadow:inset -12px -8px 20px rgba(0,0,0,.38),0 0 24px rgba(255,169,77,.25);
  animation:float 7s ease-in-out infinite;
}
.planet::after{
  content:"";position:absolute;
  left:calc(-28 * var(--u));top:calc(34 * var(--u));
  width:calc(144 * var(--u));height:calc(24 * var(--u));
  border:calc(6 * var(--u)) solid rgba(255,230,190,.75);border-radius:50%;rotate:-18deg;
}
.moonc{
  position:absolute;right:12%;top:12%;
  width:calc(64 * var(--u));height:calc(64 * var(--u));border-radius:50%;
  box-shadow:inset calc(-17 * var(--u)) calc(6 * var(--u)) 0 0 #ffe9a8,0 0 24px rgba(255,233,168,.5);
  rotate:-20deg;animation:float 8s ease-in-out infinite;
}
.neb{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 22% 30%,rgba(255,105,180,.26),transparent 48%),
    radial-gradient(ellipse at 78% 58%,rgba(80,170,255,.24),transparent 52%);
}
@keyframes float{50%{transform:translateY(-13px)}}

.shoot{
  position:absolute;top:9%;left:86%;width:105px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,#fff,transparent);rotate:-30deg;opacity:0;
  animation:shoot 7s linear infinite;
}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}4%{opacity:1}18%{transform:translate(-340px,190px);opacity:0}100%{opacity:0}}

.bld{
  position:absolute;bottom:0;border-radius:8px 8px 0 0;
  border:2.5px solid rgba(29,78,107,.35);border-bottom:0;
  background-image:radial-gradient(rgba(255,243,160,.95) 2.5px,transparent 3.2px);
  background-size:14px 18px;
  box-shadow:inset -8px 0 0 rgba(0,0,0,.14);
}
.road{position:absolute;left:0;right:0;bottom:0;height:7.5%;background:#434c5e;border-top:4px solid #cbd5e1}
.road::after{
  content:"";position:absolute;left:0;right:0;top:48%;height:3px;
  background:repeating-linear-gradient(90deg,#ffd23f 0 18px,transparent 18px 36px);opacity:.85;
}
.spk{position:absolute;filter:drop-shadow(0 0 4px #fff);animation:tw 2.5s ease-in-out infinite}
.flk{position:absolute;top:-20px;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translate(30px,112vh)}}

.rb{
  position:absolute;left:50%;top:13%;width:calc(var(--sw)*1.5);height:calc(var(--sw)*1.5);
  margin-left:calc(var(--sw)*-.75);border-radius:50%;
  background:radial-gradient(circle,transparent 55%,#ff6b6b 55% 58.5%,#ffb03a 58.5% 62%,#f7d23e 62% 65.5%,#4fd69c 65.5% 69%,#5aa9ff 69% 72.5%,#b98aff 72.5% 76%,transparent 76%);
  -webkit-mask-image:linear-gradient(#000 48%,transparent 52%);
  mask-image:linear-gradient(#000 48%,transparent 52%);
  opacity:.82;animation:shimmer 4s ease-in-out infinite alternate;
}
@keyframes shimmer{to{opacity:1}}

.fg{position:absolute;left:0;bottom:0;width:100%;height:auto;max-height:46%;display:block}
.wf{transform-box:fill-box;transform-origin:center;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.48)}}
.wx{transform-box:fill-box;transform-origin:center;animation:flapx .35s ease-in-out infinite alternate}
@keyframes flapx{to{transform:scaleX(.48)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:treesway 4.2s ease-in-out infinite alternate}
@keyframes treesway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}

#scene::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.26),transparent 60%),
             linear-gradient(transparent 60%,rgba(0,0,0,.12));
}

/* --- HUD & Top Controls (Fluidly scaled for Phones & Tablets) --- */
#hud{
  position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;gap:clamp(8px, calc(var(--sw)*.02), 14px);
  padding:clamp(10px, calc(var(--sw)*.024), 18px) clamp(12px, calc(var(--sw)*.03), 24px);
  z-index:5;font-weight:700;
  font-size:clamp(16px, calc(var(--sw)*.05), 28px);white-space:nowrap;
}
.pill{
  background:linear-gradient(180deg,#ffffff 0%,#f0f8ff 100%);
  border:3.5px solid var(--ink);border-radius:40px;
  padding:clamp(4px, calc(var(--sw)*.01), 8px) clamp(13px, calc(var(--sw)*.032), 22px);
  white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:.32em;
  color:var(--ink);
  box-shadow:inset 0 2px 0 #fff,0 4px 0 rgba(29,78,107,.38);
  transition:transform .2s var(--spring);
}
.pill.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.25)}}
.sp1{flex:1}
.coin{width:1.18em;height:1.18em;vertical-align:-.22em;flex-shrink:0}
.logo .coin{
  width:clamp(104px, min(26vw, 15vh), 156px);
  height:clamp(104px, min(26vw, 15vh), 156px);
  filter:drop-shadow(0 8px 0 rgba(29,78,107,.32));
}
.logo{animation:float 3.2s ease-in-out infinite}

.round{
  width:clamp(42px, calc(var(--sw)*.11), 62px);
  height:clamp(42px, calc(var(--sw)*.11), 62px);
  flex-shrink:0;border-radius:50%;border:3.5px solid var(--ink);
  background:linear-gradient(180deg,#ffffff 0%,#d6edff 100%);
  font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:inset 0 2px 0 #fff,0 4px 0 rgba(29,78,107,.42);
  transition:transform .2s var(--spring),box-shadow .15s;
}
.round:hover{transform:scale(1.08)}
.round:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 rgba(29,78,107,.42)}
.round .ic{width:64%;height:64%}
.pill .ic{width:1.22em;height:1.22em;flex-shrink:0}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}

#sub{
  position:absolute;left:0;right:0;
  top:calc(env(safe-area-inset-top,0px) + clamp(64px, calc(var(--sw)*.16), 98px));
  display:flex;justify-content:flex-start;align-items:center;
  gap:clamp(8px, calc(var(--sw)*.02), 14px);
  padding:0 clamp(12px, calc(var(--sw)*.03), 24px);
  z-index:5;pointer-events:none;
}
#sub .pill{font-size:clamp(15px, calc(var(--sw)*.044), 24px);padding:clamp(3px, calc(var(--sw)*.008), 6px) clamp(12px, calc(var(--sw)*.028), 18px)}
#sub .round{order:3;margin-left:auto}
#spd{transition:background .3s}
#spd.hot{background:linear-gradient(180deg,#fff3a1,#ffd23f)}

/* --- Balloons & Skins --- */
.b{
  position:absolute;bottom:-220px;
  border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
  border:3px solid rgba(29,78,107,.45);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:
    radial-gradient(ellipse 16% 10% at 28% 19%,rgba(255,255,255,.95),transparent),
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 42%),
    radial-gradient(circle at 72% 86%,rgba(255,255,255,.3),transparent 42%),
    var(--c);
  box-shadow:
    inset -8px -12px 18px rgba(0,0,0,.18),
    inset 4px 6px 12px rgba(255,255,255,.32),
    0 6px 12px rgba(0,0,0,.15);
  will-change:transform;
  animation:in .38s var(--spring);
}
.b::before{
  content:"";position:absolute;bottom:-10px;left:50%;margin-left:-8px;
  border:8px solid transparent;border-bottom:11px solid var(--c);border-top:0;
  filter:drop-shadow(0 2px 0 rgba(29,78,107,.45));
}
.b::after{
  content:"";position:absolute;top:100%;left:50%;width:2.2px;height:36px;
  margin-top:3px;background:rgba(29,78,107,.55);border-radius:2px;
}
.b .ic{
  width:62%;height:62%;display:block;pointer-events:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));
}
.b.gold{
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.9),rgba(255,255,255,0) 30%),
    linear-gradient(145deg,#ffe875,#ffc425 60%,#e89900)!important;
  border:3px solid #b9780b!important;
  box-shadow:inset -8px -12px 20px rgba(0,0,0,.18),0 0 24px 8px rgba(255,215,64,.9);
  animation:in .38s var(--spring),shine 1s ease-in-out infinite alternate;
}
.b.pw{
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 28%),var(--c)!important;
  border:3px solid rgba(255,255,255,.9)!important;
  box-shadow:inset -8px -12px 20px rgba(0,0,0,.16),0 0 18px 6px rgba(255,255,255,.85);
}
.b.mini{position:relative;bottom:auto;width:54px;height:64px;font-size:24px;animation:none}
.b.mini::after{display:none}

.sk-polka .b{
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 24%),
    radial-gradient(rgba(255,255,255,.55) 5px,transparent 6px) 0 0/20px 20px,
    var(--c);
}
.sk-stripes .b{
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 24%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.38) 0 10px,transparent 10px 20px),
    var(--c);
}
.sk-bubble .b{
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.95),rgba(255,255,255,0) 28%),
    radial-gradient(circle at 65% 75%,rgba(255,120,220,.45),rgba(110,220,255,.4) 60%,rgba(255,255,255,.18));
  border:3px solid rgba(255,255,255,.9);
  box-shadow:inset 0 0 16px rgba(255,255,255,.75);
}
.sk-rainbow .b{
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 26%),
    linear-gradient(160deg,#ff6b6b,#ffd23f,#4fd69c,#5aa9ff,#b98aff);
}

@keyframes shine{to{filter:brightness(1.22) saturate(1.18)}}
@keyframes in{from{scale:.2;opacity:0}}
.b.pop{animation:popb .2s ease-out forwards;pointer-events:none}
@keyframes popb{to{opacity:0;scale:1.6}}

/* --- Pop FX & Floating Coins --- */
.ring{position:absolute;width:34px;height:34px;margin:-17px;border:5px solid;border-radius:50%;animation:ring .45s ease-out forwards}
@keyframes ring{to{scale:4.8;opacity:0}}
.cf{position:absolute;width:11px;height:11px;margin:-5.5px;border-radius:3px;animation:cf .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(320deg);opacity:0;scale:.3}}
.plus{
  position:absolute;font-weight:700;font-size:clamp(28px, calc(var(--sw)*.075), 40px);color:#fff;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;
  margin:-18px 0 0 -16px;animation:plus .8s ease-out forwards;
}
@keyframes plus{to{transform:translateY(-74px);opacity:0}}
.fly{position:absolute;width:46px;height:46px;z-index:6;transition:transform .75s cubic-bezier(.5,-.2,.6,1),opacity .75s}
.fly .coin{width:46px;height:46px}

/* --- Screens, Menus & Buttons (Phone & Tablet Responsive) --- */
.screen{
  position:absolute;top:0;bottom:0;left:50%;width:var(--sw);margin-left:calc(var(--sw)/-2);
  z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  gap:clamp(12px, 2.2vh, 22px);text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) clamp(16px, calc(var(--sw)*.045), 36px) calc(env(safe-area-inset-bottom,0px) + 20px);
  background:radial-gradient(circle at 50% 30%,rgba(25,90,150,.28),rgba(8,30,60,.5));
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  overflow-y:auto;overflow-x:hidden;
  transition:opacity .32s,transform .32s,visibility .32s;
}
.screen.hide{opacity:0;visibility:hidden;transform:scale(.94);pointer-events:none}
.screen:not(.hide)>*{animation:rise .52s var(--spring) both}
.screen:not(.hide)>:nth-child(2){animation-delay:.05s}
.screen:not(.hide)>:nth-child(3){animation-delay:.1s}
.screen:not(.hide)>:nth-child(4){animation-delay:.15s}
.screen:not(.hide)>:nth-child(5){animation-delay:.2s}
.screen:not(.hide)>:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.92)}}

h1,h2{
  margin:0;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;
  text-shadow:0 7px 0 rgba(29,78,107,.38);line-height:1.02;letter-spacing:.5px;
}
h1{font-size:clamp(48px, min(14vw, 9vh), 92px)}
h2{font-size:clamp(34px, min(9.5vw, 6.5vh), 54px);-webkit-text-stroke:8px var(--ink)}

.big{
  position:relative;font-family:inherit;font-weight:700;
  font-size:clamp(26px, min(7.5vw, 4.4vh), 38px);
  padding:clamp(12px, 1.8vh, 18px) clamp(44px, calc(var(--sw)*.13), 72px);
  border-radius:60px;border:4px solid var(--ink);
  background:linear-gradient(180deg,#ff9494,#ff5959);color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.28);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 8px 0 #b73a3a,0 14px 20px rgba(0,0,0,.22);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .2s var(--spring),box-shadow .2s;
}
.big::before{
  content:"";position:absolute;left:12%;right:12%;top:5px;height:28%;
  border-radius:30px;background:rgba(255,255,255,.32);pointer-events:none;
}
.big:hover{transform:scale(1.05)}
.big:active{transform:translateY(6px) scale(.98);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 #b73a3a}
.big .ic{width:1.15em;height:1.15em;flex-shrink:0}
.big.low{filter:grayscale(.55);opacity:.82}

#play,#again{
  background:linear-gradient(180deg,#8cf29a 0%,#2fbf4f 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 8px 0 #1f8a38,0 14px 20px rgba(0,0,0,.24);
}
#play{animation:throb 1.8s ease-in-out infinite}
#play:active,#again:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 #1f8a38}
@keyframes throb{50%{scale:1.05}}

.big.alt{
  background:linear-gradient(180deg,#94d0ff 0%,#4696e6 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.48),0 7px 0 #2b67ab,0 12px 18px rgba(0,0,0,.2);
  font-size:clamp(21px, min(6vw, 3.6vh), 30px);
  padding:clamp(10px, 1.5vh, 15px) clamp(32px, calc(var(--sw)*.09), 52px);
}
.big.alt:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 #2b67ab}

/* --- Level Select --- */
.levels{display:flex;flex-direction:column;gap:clamp(12px, 2vh, 18px);width:100%;align-items:center}
.lv{
  font-family:inherit;color:var(--ink);display:flex;align-items:center;gap:16px;
  width:min(88%, 420px);padding:clamp(12px, 1.8vh, 16px) 22px;
  border-radius:28px;border:4px solid var(--ink);
  background:linear-gradient(180deg,#ffffff,#e3f4ff);
  box-shadow:inset 0 2px 0 #fff,0 7px 0 rgba(29,78,107,.52);
  cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s;
}
.lv:hover{transform:scale(1.04)}
.lv:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(29,78,107,.52)}
.lv.on{background:linear-gradient(180deg,#fff5b8,var(--sun))}
.lv .ic-wrap{
  width:clamp(50px, calc(var(--sw)*.12), 62px);
  height:clamp(50px, calc(var(--sw)*.12), 62px);
  border-radius:18px;background:rgba(255,255,255,.78);
  border:2.5px solid rgba(29,78,107,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.lv svg{width:78%;height:78%}
.lv .nm{font-size:clamp(24px, calc(var(--sw)*.065), 32px);font-weight:700;flex:1;text-align:left}
.lv .bs{

/* --- Shop (Multi-column responsive grid on Phones & Tablets) --- */

  box-shadow:0 6px 0 rgba(29,78,107,.48);
}

}
.item button:active{transform:translateY(3px);box-shadow:0 1px 0 #c99a10}
.item button.use{background:linear-gradient(180deg,#b0f7da,#5ce0ad);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #2e9c73}

.tracks{display:flex;flex-wrap:wrap;gap:8px}
.tk{

#gearBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + clamp(10px, calc(var(--sw)*.024), 18px));right:clamp(12px, calc(var(--sw)*.03), 24px)}

  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.75),transparent 36%),var(--c);
  opacity:.82;z-index:-1;pointer-events:none;display:flex;align-items:center;justify-content:center;
  animation:mbup linear infinite;
}
#menu .mb .ic{width:58%;height:58%;opacity:.92}
@keyframes mbup{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-130vh) rotate(6deg)}}

#pz{
  position:absolute;inset:0;z-index:4;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  background:rgba(10,45,80,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);

}
#pz small{font-size:clamp(20px, calc(var(--sw)*.052), 28px);-webkit-text-stroke:5px var(--ink)}
#pz.on{display:flex}

#game.frozen::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle,transparent 45%,rgba(155,231,255,.55));
  pointer-events:none;z-index:4;
}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

#toast{
  position:absolute;left:0;right:0;top:38%;z-index:8;text-align:center;
  font-size:clamp(38px, calc(var(--sw)*.11), 68px);font-weight:700;color:#fff;
  -webkit-text-stroke:9px var(--ink);paint-order:stroke fill;
  pointer-events:none;opacity:0;
}
#toast .ic{width:1.05em;height:1.05em;vertical-align:-.14em}
#toast.show{animation:toast 1.3s forwards}
@keyframes toast{
  0%{transform:scale(.3);opacity:0}
  20%{transform:scale(1.1);opacity:1}
  70%{opacity:1}
  100%{transform:translateY(-50px);opacity:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

</div>

/* --- WebAudio SFX & Warm Procedural Music --- */
function audio(){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
}
function beep(f,d,t,v){
  if(!sound||!ac)return;
  try{
    var now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),flt=ac.createBiquadFilter();
    o.type=t||'sine';o.frequency.setValueAtTime(f,now);
    flt.type='lowpass';flt.frequency.setValueAtTime(2400,now);
    var peak=Math.max(.0001,(v||.22)*(S.sfx===undefined?1:S.sfx));
    g.gain.setValueAtTime(.0001,now);
    g.gain.linearRampToValueAtTime(peak,now+.012);
    g.gain.exponentialRampToValueAtTime(.0008,now+d);
    o.connect(flt);flt.connect(g);g.connect(ac.destination);
    o.start(now);o.stop(now+d+.02);
  }catch(e){}
}

/* --- Main Game Loop & Balloon Spawning --- */
function loop(){
  if(!running)return;
  if(!paused)spawn();
  timer=setTimeout(loop,lvObj().gap/Math.pow(speedMul(),.6));
}
function spawn(){
  if(!running)return;
  var L=lvObj(),w=game.clientWidth,h=game.clientHeight,rn=Math.random();
  var gold=rn<.02,heart=rn>=.02&&rn<.03,ice=rn>=.03&&rn<.05;
  var sc=Math.max(.85,Math.min(w/390,1.65)),sz=R(84,108)*sc,c=gold?'#ffc425':heart?'#ff4d6d':ice?'#9be7ff':cols[Math.floor(Math.random()*cols.length)];
  var b=document.createElement('div');
  b.className='b'+(gold?' gold':'')+(heart||ice?' pw':'');
  b.setAttribute('role','button');b.setAttribute('aria-label','Balloon');
  b.style.cssText='left:'+pickX(w,sz)+'px;width:'+sz+'px;height:'+sz*1.22+'px;font-size:'+sz*.45+'px;--c:'+c;
  b.innerHTML=gold?ANI[3]:heart?IC.hw:ice?IC.ice:pick(skinObj().faces);
  var dur=R(L.dur[0],L.dur[1])/speedMul(),sp=(h+sz*2.8)/dur,sw=R(6,22)*sc,ph=R(0,6),t0=performance.now(),dt=0,lt=t0,alive=true,g=gen;
  b._sp=sp;$('field').appendChild(b);
  function step(t){
    if(!alive||g!==gen){alive=false;return}
    var f=paused?0:(t<freezeUntil?.3:1);
    dt+=(t-lt)*f;lt=t;
    var y=-dt*sp;
    b.style.transform='translate('+Math.sin(dt/700+ph)*sw+'px,'+y+'px) rotate('+Math.sin(dt/600+ph)*5+'deg)';
    if(-y>h+240){
      alive=false;b.remove();
      if(!gold&&!heart&&!ice)miss();
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  b._alive=function(){return alive};
  b.addEventListener('pointerdown',function(e){
    e.preventDefault();if(!alive)return;alive=false;audio();buzz();
    var nw=performance.now();
    combo=nw-lastPop<800?Math.min(combo+1,9):0;lastPop=nw;
    beep(notes[combo%5]*(1+Math.floor(combo/5)),.18,'triangle');
    var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
    burst(x,y,c);b.classList.add('pop');setTimeout(function(){b.remove()},210);
    score++;$('score').textContent='Score: '+score;
    if(score>(S.best[S.lv]||0))S.best[S.lv]=score;
    if(startBest>0&&score>startBest&&!told){told=true;say('New best! '+IC.star);}
    else if(score%15===0&&lives<maxLives){lives++;lifeUI();say('+'+IC.heart);}
    else if(score%5===0&&speedMul()<3){say('Faster! '+IC.bolt);}
    hud();
    if(heart){if(lives<maxLives){lives++;lifeUI();}say('+'+IC.heart);}
    if(ice){
      freezeUntil=performance.now()+5000;game.classList.add('frozen');say('Freeze! '+IC.ice);
      setTimeout(function(){if(performance.now()>=freezeUntil)game.classList.remove('frozen')},5100);
    }
    if(gold){
      var n=5+Math.floor(Math.random()*16);earned+=n;say('Golden bonus! +'+n+' '+COIN);
      for(var i=0;i<n;i++)(function(i){setTimeout(function(){S.coins++;save();flyCoin(x+R(-30,30),y+R(-30,30));},i*80)})(i);
    }
    if(score%5===0){S.coins++;earned++;save();flyCoin(x,y);}
  });
}

function mb(f,d,t,v){
  if(!ac||v<=0)return;
  try{
    var now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),flt=ac.createBiquadFilter();
    o.type=t||'sine';
    o.frequency.setValueAtTime(f,now);
    flt.type='lowpass';
    flt.frequency.setValueAtTime(t==='sine'?1200:1650,now);
    var att=Math.min(.045,d*.28);
    g.gain.setValueAtTime(.0001,now);
    g.gain.linearRampToValueAtTime(v,now+att);
    g.gain.exponentialRampToValueAtTime(.0001,now+d);
    o.connect(flt);flt.connect(g);g.connect(ac.destination);
    o.start(now);o.stop(now+d+.04);
  }catch(e){}
}
function musicTick(){
  var t=TRACKS[S.mus]||TRACKS[0];
  if(t.m&&ac&&sound&&!paused&&S.mvol>0){
    var i=mi++,f=t.m[i%t.m.length],c=t.c?t.c[i%t.c.length]:0,b=t.b[i%t.b.length];
    if(f)mb(f,t.ms*.0019,t.w,t.v*S.mvol);
    if(c)mb(c,t.ms*.0028,'sine',t.v*.55*S.mvol);
    if(b)mb(b,t.ms*.0032,'sine',.085*S.mvol);
  }
  setTimeout(musicTick,t.ms||400);
}

$('field').addEventListener('pointerdown',function(e){

    var k=kids[i];if(!k._alive||!k._alive())continue;
    var r=k.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2+(k._sp||0)*(now<freezeUntil?.3:1)*70,
        d=Math.hypot((e.clientX-cx)/(r.width*.575),(e.clientY-cy)/(r.height*.575));
    if(d<1&&d<bd){bd=d;best=k}
  }
  if(best)best.dispatchEvent(new Event('pointerdown',{cancelable:true}));
});
